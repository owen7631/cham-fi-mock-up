<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>[M-10-06-02 · M-09-S1] 신청 전 홈 · CHAM-Fi</title>
  <link rel="stylesheet" href="css/chamfi.css" />
  <script src="js/auth.js"></script>
  <style>
    .home { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: var(--space-5); padding: var(--space-5) var(--space-5) var(--space-4); overflow-x: hidden; overflow-y: auto; scrollbar-width: none; }
    .home::-webkit-scrollbar { display: none; }

    .applycard {
      display: flex; flex-direction: column; gap: var(--space-4);
      padding: var(--space-5);
      border: 1px solid var(--chamfi-line); border-radius: var(--radius-xl);
      background: var(--chamfi-bg);
      text-align: left;
      transition: transform 0.1s;
    }
    .applycard:active { transform: scale(0.995); }
    .applycard__head { display: flex; flex-direction: column; gap: var(--extra-gap-2); }

    .asset { border-radius: var(--radius-2xl); background: var(--chamfi-surface); box-shadow: var(--shadow-card); overflow: hidden; flex: none; }
    .asset__hero {
      display: flex; flex-direction: column; gap: var(--space-4);
      padding: var(--space-5) var(--space-5) var(--extra-space-22);
      background-image: linear-gradient(160.82deg, var(--chamfi-hero-from) 0%, var(--chamfi-hero-to) 72.993%);
      color: var(--chamfi-on-hero);
    }
    .asset__head { display: flex; align-items: center; justify-content: space-between; }
    .asset__head img { width: 20px; height: 20px; }
    .asset__value { display: flex; flex-direction: column; gap: var(--space-1); }
    .asset__sub { color: var(--chamfi-on-hero-muted); }

    .share { display: flex; gap: var(--extra-space-3); width: 100%; }
    .share__on { flex: none; width: 31.14%; height: 8px; border-radius: var(--extra-radius-4); background: var(--chamfi-accent); }
    .share__off { flex: 1; height: 8px; border-radius: var(--extra-radius-4); background: var(--chamfi-on-hero-muted); opacity: 0.35; }

    .legend { display: flex; flex-direction: column; gap: var(--extra-gap-2); }
    .legend__row { display: flex; align-items: center; gap: var(--space-2); font: var(--type-body-sm-weight) var(--type-body-sm-size)/var(--type-body-sm-line) var(--font-family); }
    .legend__row img { flex: none; width: 8px; height: 8px; }
    .legend__row .l { flex: 1; min-width: 0; display: flex; gap: var(--extra-gap-6); }
    .legend__row .l b { font-weight: var(--font-weight-semibold); }
    .legend__row .l span { color: var(--chamfi-on-hero-muted); }
    .legend__row > b { font-weight: var(--font-weight-semibold); white-space: nowrap; }

    .asset__bottom { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-5); }
    .summary { display: flex; align-items: center; gap: var(--space-3); }
    .summary img { flex: none; width: 44px; height: 44px; }
    .summary__text { flex: 1; min-width: 0; }
    .summary__amount { white-space: nowrap; letter-spacing: -0.2px; }

    .foot { text-align: center; }
  
    .applycard__top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); }
    .applycard__top img { flex: none; width: 20px; height: 20px; margin-top: 2px; }
    .applycard .cf-btn { gap: var(--space-2); }
</style>
</head>
<body>
  <main class="phone phone--sunken">
    <header class="cf-header cf-header--home">
      <img class="cf-wordmark" src="assets/wordmark-chamfi.svg" alt="CHAM-Fi" />
      <button class="cf-bell" type="button" data-toast="알림은 프로토타입에 연결되지 않았어요" aria-label="알림">
        <img class="cf-bell__icon" src="assets/icon-bell.svg" alt="" />
        <span class="cf-bell__badge">1</span>
      </button>
    </header>

    <div class="home">
      <section class="applycard">
        <div class="applycard__head">
          <p class="t-title-lg ink"><span data-f="name">부경축공</span> 님, 내 소 자산으로<br />금융사 대출 조회를 시작해 볼까요?</p>
          <p class="t-body-sm ink-muted">내 소 자산으로 신청할 수 있는 상품을 찾아드려요</p>
        </div>
        <a class="cf-btn cf-btn--primary" data-href="cattle-loading.html">금융사 조회하기<img src="assets/icon-arrow.svg" alt="" /></a>
      </section>

      <section class="asset">
        <div class="asset__hero">
          <div class="asset__head">
            <p class="t-title-md">내 소 자산</p>
            <img src="assets/icon-chevron-right.svg" alt="" />
          </div>
          <div class="asset__value">
            <p class="t-body-sm asset__sub">현재 추정 시세</p>
            <p class="t-display" data-f="asset">약 7,190만 원</p>
          </div>
          <div style="display:flex;flex-direction:column;gap:var(--space-4)">
            <div class="share"><span class="share__on" data-f-width="share"></span><span class="share__off"></span></div>
            <div class="legend">
              <div class="legend__row">
                <img src="assets/legend-dot-accent.svg" alt="" />
                <div class="l"><b>산정 대상</b><span>전체 <span data-f="total">26</span>두</span></div>
                <b>거세우 <span data-f="steer">8</span>두</b>
              </div>
              <div class="legend__row">
                <img src="assets/legend-dot-muted.svg" alt="" />
                <div class="l"><b>대상 아님</b><span>수 <span data-f="male">10</span>두 · 암 <span data-f="female">8</span>두</span></div>
                <b><span data-f="nonTarget">18</span>두</b>
              </div>
            </div>
          </div>
        </div>
        <div class="asset__bottom">
          <div class="summary">
            <img src="assets/icon-bank-m09.svg" alt="" />
            <div class="summary__text">
              <p class="t-body-strong ink">담보가치인정액</p>
              <p class="t-micro ink-subtle">금융사 추정 금액</p>
            </div>
            <p class="t-title-lg ink summary__amount" data-f="collateral">약 4,110만 원</p>
          </div>
          <a class="cf-btn cf-btn--tonal" data-href="cattle-loading.html">
            개체 정보 다시 조회하기<img src="assets/icon-arrow.svg" alt="" />
          </a>
        </div>
      </section>

      <p class="foot t-micro ink-subtle">자산 금액은 시장 평균 시세 기준 추정값이며, 심사·실행은 금융사에서 진행돼요</p>
    </div>

    <nav class="cf-tabbar">
      <a class="cf-tab" data-href="index.html"><span class="cf-tab__icon"><img src="assets/tab-shop.svg" alt="" /></span>구매하기</a>
      <a class="cf-tab" data-toast><span class="cf-tab__icon"><img src="assets/tab-orders.svg" alt="" /></span>주문내역</a>
      <a class="cf-tab" data-href="index.html"><span class="cf-tab__icon"><img src="assets/tab-home.svg" alt="" /></span>홈</a>
      <a class="cf-tab" data-toast><span class="cf-tab__icon"><img src="assets/tab-me.svg" alt="" /></span>내정보</a>
      <a class="cf-tab is-active" data-href="home.html">
        <span class="cf-tab__icon">
          <span class="cf-bars"><i></i><i></i><i></i></span>
          <img class="cf-tab__new" src="assets/tab-new-dot.svg" alt="" />
        </span>CHAM-Fi
      </a>
    </nav>
  </main>

  <script src="js/farm.js"></script>
  <script src="js/chamfi.js"></script>
</body>
</html>
