<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>[M-05 · M-06] 금융사 조회 중 · CHAM-Fi</title>
  <link rel="stylesheet" href="css/chamfi.css" />
  <script src="js/auth.js"></script>
  <style>
    .fin { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: var(--space-10); padding: var(--space-10) var(--space-5) var(--space-4); overflow: hidden; }
    .fin__top { display: flex; flex-direction: column; align-items: center; gap: var(--space-6); }
    .fin__title { width: 100%; text-align: center; min-height: 60px; }

    .ring { position: relative; width: 240px; height: 264px; flex: none; }
    .ring img { position: absolute; left: 0; top: 0; width: 240px; height: 240px; }
    .ring__spin { animation: spin 2.208s linear infinite; transform-origin: 120px 120px; }  /* Figma: 0.271초마다 44.18° → 한 바퀴 2.208초 */
    .is-paused .ring__spin { animation-play-state: paused; }
    body.is-leaving .phone { opacity: 0; transition: opacity 0.35s ease-in-out; }  /* 결과로 이동할 때 디졸브 0.35초 */
    @keyframes spin { to { transform: rotate(360deg); } }
    .ring .ring__shadow { left: 60px; top: 250px; width: 120px; height: 14px; }
    .ring__num {
      position: absolute; left: 39px; top: 86px; width: 120px;
      text-align: right;
      font-size: var(--type-ring-number-size); line-height: 1.1; font-weight: var(--type-ring-number-weight); color: var(--extra-ring-number);
      font-variant-numeric: tabular-nums;
    }
    .ring__unit { position: absolute; left: 152px; top: 106px; padding: var(--space-2); font-size: var(--type-ring-unit-size); line-height: 1.1; font-weight: var(--type-ring-unit-weight); color: var(--extra-ring-unit); }

    .fin__list { display: flex; flex-direction: column; gap: var(--space-6); }
    .rows { display: flex; flex-direction: column; gap: var(--space-2); }
  </style>
</head>
<body>
  <main class="phone">
    <header class="cf-header cf-header--exit">
      <button class="cf-exit" id="exit" type="button">나가기</button>
    </header>

    <div class="fin">
      <div class="fin__top">
        <h1 class="t-title-xl ink fin__title" id="title">제휴 금융사에<br />확인 요청 중이예요</h1>
        <div class="ring" aria-label="조회 진행률">
          <img src="assets/fin-track.svg" alt="" />
          <img class="ring__spin" src="assets/fin-spinner.svg" alt="" />
          <p class="ring__num" id="num">12</p>
          <p class="ring__unit">%</p>
          <img class="ring__shadow" src="assets/fin-shadow.svg" alt="" />
        </div>
      </div>

      <div class="fin__list">
        <p class="cf-notice cf-notice--strong">조회만으로는 신용점수에 영향이 없어요</p>
        <div class="rows" id="rows"></div>
      </div>

      <div class="cf-spacer"></div>
    </div>

    <!-- 나가기 확인 팝업 (M-05-X) -->
    <div class="cf-overlay" id="exitDialog">
      <div class="cf-dialog" role="dialog" aria-modal="true">
        <div class="cf-dialog__text">
          <p class="t-title-md ink">금융사 조회를 그만할까요?</p>
          <p class="t-body-sm ink-muted">지금 나가면 조회가 취소돼요.<br />다시 조회하면 금리와 한도가 달라질 수 있어요.</p>
        </div>
        <div class="cf-dialog__actions">
          <a class="cf-dialog__btn cf-dialog__btn--secondary" data-href="shop-home.html">나가기</a>
          <button class="cf-dialog__btn cf-dialog__btn--primary" id="keepGoing" type="button">계속 조회하기</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/farm.js"></script>
  <script src="js/chamfi.js"></script>
  <script>
    (function () {
      // ── Figma 프로토타입(M-05) 타이밍 ──
      //  · 링: 0.001초 대기 + 0.27초 선형 애니메이션 = 한 단계 0.271초, 24단계 (12% → 99%)
      //  · 제목: 1.7초 뒤 2단계, 그로부터 1.7초 뒤 3단계 (전환 0.3초)
      //  · 결과 목록: 1.7초 뒤 2행, 그로부터 1.7초 뒤 3행 (전환 0.35초)
      //  · 6.2초가 지나면 결과 화면으로 이동 (디졸브 0.35초)
      var STEP_MS = 271;
      var PERCENTS = [12, 18, 23, 28, 34, 39, 44, 49, 53, 58, 62, 66, 70, 74, 78, 81, 84, 87, 90, 93, 95, 97, 98, 99];
      var TITLE_AT = [0, 1700, 3700];
      var ROWS_AT = [0, 1700, 3750];
      var NAV_MS = 6200;
      var FADE_MS = 350;

      var banks = [
        { badge: "축", color: "var(--extra-badge-chukhyup)", name: "참참축협",   sub: "축우담보 운영자금", rate: "연 4.6~5.2%", limitBase: 10000 },
        { badge: "은", color: "var(--extra-badge-bank-strong)", name: "참참은행",   sub: "축산 운영자금대출", rate: "연 5.1~5.9%", limitBase: 8000 },
        { badge: "캐", color: "var(--extra-badge-capital-strong)", name: "참참캐피탈", sub: "축우담보대출",     rate: "연 7.9~9.4%", limitBase: 12000 }
      ];

      var stages = [
        "제휴 금융사에<br />확인 요청 중이예요",
        "알림이 많이 와도<br />놀라지 마세요",
        "거의 다 됐어요<br />10초 안에 조회가 끝나요"
      ];

      var $ = function (id) { return document.getElementById(id); };
      var rowsEl = $("rows");
      var shown = 0, step = -1, titleIdx = -1;
      var elapsed = 0, last = 0, timer = null, finished = false;

      function addRow(b) {
        var el = document.createElement("div");
        el.className = "cf-resultrow";
        el.innerHTML =
          '<div class="cf-badge cf-badge--36" style="background:' + b.color + '">' + b.badge + "</div>" +
          '<div class="cf-resultrow__text"><p class="t-title-md ink">' + b.name + '</p><p class="t-body-sm ink-muted">' + b.sub + "</p></div>" +
          '<div class="cf-resultrow__rate"><p class="t-price primary">' + b.rate + '</p><p class="t-body-sm ink-muted">' + "최대 " + cfFarm.fmtMan(cfFarm.limit(b.limitBase)) + " 원" + "</p></div>";
        rowsEl.appendChild(el);
      }

      function idxAt(table) {
        var n = 0;
        for (var i = 0; i < table.length; i++) { if (elapsed >= table[i]) n = i; }
        return n;
      }

      function render() {
        var s = Math.min(PERCENTS.length - 1, Math.floor(elapsed / STEP_MS));
        if (s !== step) { step = s; $("num").textContent = PERCENTS[step]; }
        var t = idxAt(TITLE_AT);
        if (t !== titleIdx) { titleIdx = t; $("title").innerHTML = stages[t]; }
        var r = idxAt(ROWS_AT) + 1;
        while (shown < r) { addRow(banks[shown]); shown += 1; }
      }

      function frame() {
        var now = performance.now();
        elapsed += now - last;
        last = now;
        render();
        if (elapsed >= NAV_MS) finish();
      }

      function finish() {
        stop();
        if (finished) return;
        finished = true;
        if (window.self !== window.top) return; // index 미리보기(iframe)에서는 이동하지 않음
        cfFarm.setFinanceChecked(); // 금융사 조회 완료 상태 저장
        document.body.classList.add("is-leaving");
        setTimeout(function () { window.location.href = "result.html"; }, FADE_MS);
      }

      function start() { stop(); last = performance.now(); timer = setInterval(frame, 30); document.body.classList.remove("is-paused"); }
      function stop() { clearInterval(timer); timer = null; document.body.classList.add("is-paused"); }

      render();
      start();

      $("exit").addEventListener("click", function () { stop(); cfOverlay("exitDialog", true); });
      $("keepGoing").addEventListener("click", function () { cfOverlay("exitDialog", false); if (!finished) start(); });
    })();
  </script>
</body>
</html>
