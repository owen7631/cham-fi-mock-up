<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>[M-03-W] 소 조회 로딩 · CHAM-Fi</title>
  <link rel="stylesheet" href="css/chamfi.css" />
  <script src="js/auth.js"></script>
  <style>
    .load { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: var(--space-10); padding: var(--space-10) var(--space-5) var(--space-6); }
    .load__top { display: flex; flex-direction: column; align-items: center; gap: var(--space-6); width: 100%; }

    .counter {
      display: flex; align-items: center; justify-content: center; gap: var(--extra-gap-6);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-pill);
      color: var(--chamfi-primary);
      font: var(--type-number-lg-weight) var(--type-number-lg-size)/var(--type-number-lg-line) var(--font-family);
      white-space: nowrap;
    }
    .counter__num { display: inline-block; min-width: 65px; text-align: left; }

    .load__title { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); text-align: center; width: 100%; }
    .load__title h1 { min-height: 60px; }

    /* stage : halo + 참참이 3D + progress ring */
    .stage { position: relative; width: 220px; height: 220px; flex: none; }
    .stage__halo { position: absolute; left: 12px; top: 12px; width: 196px; height: 196px; }
    .stage .cf-face { position: absolute; left: 12px; top: 12px; width: 196px; height: 196px; }
    .stage .cf-face img { top: 8px; }
    .stage__ring { position: absolute; left: 0; top: 0; width: 220px; height: 220px; }
    .stage__ring circle { fill: none; stroke-width: 4.95; }
    .stage__ring .track { stroke: var(--chamfi-line); }
    .stage__ring .arc { stroke: var(--chamfi-primary); transform: rotate(-90deg); transform-origin: 110px 110px; transition: stroke-dashoffset 0.6s ease; }

    /* 진행 카드 */
    .cards { display: flex; flex-direction: column; gap: var(--space-2); width: 100%; }
    .card {
      display: flex; align-items: center; gap: var(--space-3);
      height: 56px;
      padding: 0 var(--space-4);
      border: 1px solid var(--chamfi-line);
      border-radius: var(--radius-md);
      background: var(--chamfi-surface);
      transition: opacity 0.3s, background-color 0.3s, border-color 0.3s;
    }
    .card__state { flex: none; width: 22px; height: 22px; position: relative; }
    .card__state img, .card__state svg { position: absolute; inset: 0; width: 22px; height: 22px; }
    .card__state .tick-bg { fill: var(--chamfi-primary); }
    .card__state .tick-mark { stroke: var(--chamfi-on-primary); }
    .card__state svg { display: none; }
    .card__label { flex: 1 1 0; min-width: 0; font: var(--type-body-strong-weight) var(--type-body-strong-size)/var(--type-body-strong-line) var(--font-family); color: var(--chamfi-ink-muted); }
    .card__value { display: flex; align-items: center; justify-content: flex-end; gap: var(--extra-gap-6); width: 170px; font: var(--type-body-strong-weight) var(--type-body-strong-size)/var(--type-body-strong-line) var(--font-family); white-space: nowrap; }

    .card.is-pending { opacity: 0.45; }
    .card.is-pending .card__value { color: var(--chamfi-ink-subtle); }
    .card.is-active { border-color: var(--chamfi-hero-from); }
    .card.is-active .card__value { color: var(--chamfi-primary); }
    .card.is-done { background: var(--chamfi-surface-sunken); }
    .card.is-done .card__state img { display: none; }
    .card.is-done .card__state svg { display: block; }
    .card.is-done .card__value { color: var(--chamfi-ink); font-weight: var(--font-weight-bold); }
    .card .dots { display: none; }
    .card.is-active .dots { display: inline-flex; }

    .dots { gap: var(--space-1); align-items: center; height: 9px; }
    .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--chamfi-primary); animation: dot 1.05s infinite; }
    .dots i:nth-child(1) { opacity: 1; }
    .dots i:nth-child(2) { opacity: 0.45; animation-delay: 0.15s; }
    .dots i:nth-child(3) { opacity: 0.18; animation-delay: 0.3s; }
    @keyframes dot { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
  </style>
</head>
<body>
  <main class="phone">
    <header class="cf-header cf-header--exit">
      <button class="cf-exit" id="exit" type="button">나가기</button>
    </header>

    <div class="load">
      <div class="load__top">
        <div class="counter"><span id="counterLabel">개체 확인 중</span><span class="counter__num" id="counterNum">1두</span></div>
        <div class="load__title">
          <h1 class="t-title-xl ink" id="title">축산물이력제에서<br />개체 정보를 불러오고 있어요</h1>
          <p class="t-body-sm ink-muted" id="sub">잠시만 기다려 주세요</p>
        </div>
        <div class="stage">
          <img class="stage__halo" src="assets/halo.svg" alt="" />
          <div class="cf-face" id="face">
            <img src="assets/face-open.png" alt="" class="is-on" data-face="open" />
            <img src="assets/face-closed.png" alt="" data-face="closed" />
            <img src="assets/face-smile.png" alt="" data-face="smile" />
            <img src="assets/face-wink.png" alt="" data-face="wink" />
            <img src="assets/face-trouble.png" alt="" data-face="trouble" />
          </div>
          <svg class="stage__ring" viewBox="0 0 220 220" aria-hidden="true">
            <circle class="track" cx="110" cy="110" r="107.525" />
            <circle class="arc" id="arc" cx="110" cy="110" r="107.525" />
          </svg>
        </div>
      </div>

      <div class="cards">
        <div class="card is-active" id="card1">
          <span class="card__state"><img src="assets/state-circle.svg" alt="" /><svg viewBox="0 0 22 22" fill="none"><circle class="tick-bg" cx="11" cy="11" r="11" /><path class="tick-mark" d="M6 11L9.5 14.5L16 7.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg></span>
          <span class="card__label">개체 정보 구성</span>
          <span class="card__value"><span id="v1">확인 중</span><span class="dots"><i></i><i></i><i></i></span></span>
        </div>
        <div class="card is-pending" id="card2">
          <span class="card__state"><img src="assets/state-circle.svg" alt="" /><svg viewBox="0 0 22 22" fill="none"><circle class="tick-bg" cx="11" cy="11" r="11" /><path class="tick-mark" d="M6 11L9.5 14.5L16 7.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg></span>
          <span class="card__label">예상 산정 대상</span>
          <span class="card__value"><span id="v2">대기</span><span class="dots"><i></i><i></i><i></i></span></span>
        </div>
      </div>

      <div class="cf-spacer"></div>
    </div>

    <!-- 나가기 확인 팝업 (M-03-W-X) -->
    <div class="cf-overlay" id="exitDialog">
      <div class="cf-dialog" role="dialog" aria-modal="true">
        <div class="cf-dialog__text">
          <p class="t-title-md ink">개체 정보 조회를 그만할까요?</p>
          <p class="t-body-sm ink-muted">지금 나가면 조회한 내용이 저장되지 않아요.<br />다시 들어오면 처음부터 조회해요.</p>
        </div>
        <div class="cf-dialog__actions">
          <a class="cf-dialog__btn cf-dialog__btn--secondary" data-href="shop-home.html">나가기</a>
          <button class="cf-dialog__btn cf-dialog__btn--primary" id="keepGoing" type="button">계속 조회하기</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/farm.js"></script>
  <script src="js/chamfi.js"></script>
  <script>
    (function () {
      var STEP_MS = 700;               // 8단계 · 총 약 5.6초
      var C = 2 * Math.PI * 107.525;   // 링 둘레

      var steps = [
        { n: "1두",  fill: 0.06, face: "open",  t: "축산물이력제에서<br />개체 정보를 불러오고 있어요", s: "잠시만 기다려 주세요" },
        { n: "5두",  fill: 0.18, face: "open",  t: "축산물이력제에서<br />개체 정보를 불러오고 있어요", s: "잠시만 기다려 주세요" },
        { n: "9두",  fill: 0.30, face: "open",  t: "축산물이력제에서<br />개체 정보를 불러오고 있어요", s: "잠시만 기다려 주세요" },
        { n: "12두", fill: 0.45, face: "smile", t: "개체 정보를<br />하나씩 확인하고 있어요", s: "개체이력번호는 직접 입력하지 않아도 돼요" },
        { n: "16두", fill: 0.58, face: "smile", t: "개체 정보를<br />하나씩 확인하고 있어요", s: "개체이력번호는 직접 입력하지 않아도 돼요" },
        { n: "20두", fill: 0.72, face: "smile", t: "마지막으로 산정 대상을<br />정리하고 있어요", s: "조회만으로는 어떤 정보도 금융사에 전달되지 않아요" },
        { n: "26두", fill: 0.88, face: "smile", t: "마지막으로 산정 대상을<br />정리하고 있어요", s: "조회만으로는 어떤 정보도 금융사에 전달되지 않아요" },
        { n: "8두",  fill: 1.00, face: "smile", t: "내 농장의 축산이력제를<br />모두 확인했어요", s: "곧 결과를 보여드릴게요", done: true }
      ];

      var $ = function (id) { return document.getElementById(id); };
      var arc = $("arc");
      arc.style.strokeDasharray = C;
      arc.style.strokeDashoffset = C;

      function setFace(name) {
        document.querySelectorAll("#face img").forEach(function (img) {
          img.classList.toggle("is-on", img.getAttribute("data-face") === name);
        });
      }

      function setCard(el, state) {
        el.classList.remove("is-pending", "is-active", "is-done");
        el.classList.add("is-" + state);
      }

      var idx = 0, timer = null, blinkTimer = null, finished = false;

      function render(i) {
        var s = steps[i];
        $("counterLabel").textContent = s.done ? "산정 대상 총" : "개체 확인 중";
        $("counterNum").textContent = s.done ? farm.steer + "두" : s.n;
        $("title").innerHTML = s.t;
        $("sub").textContent = s.s;

        // 카드 상태 (1~3 · 개체 구성 확인 중 / 4~7 · 산정 대상 확인 중 / 8 · 모두 완료)
        if (i <= 2) {
          setCard($("card1"), "active"); $("v1").textContent = "확인 중";
          setCard($("card2"), "pending"); $("v2").textContent = "대기";
        } else if (i <= 6) {
          setCard($("card1"), "done"); $("v1").textContent = "거세 " + farm.steer + " · 수 " + farm.male + " · 암 " + farm.female;
          setCard($("card2"), "active"); $("v2").textContent = "확인 중";
        } else {
          setCard($("card1"), "done"); $("v1").textContent = "거세 " + farm.steer + " · 수 " + farm.male + " · 암 " + farm.female;
          setCard($("card2"), "done"); $("v2").textContent = "거세우 " + farm.steer + "두";
        }
      }

      function tick() {
        if (idx >= steps.length) { finish(); return; }
        render(idx);
        idx += 1;
      }

      function finish() {
        stop();
        if (finished) return;
        finished = true;
        if (window.self !== window.top) return; // index 미리보기(iframe)에서는 이동하지 않음
        setTimeout(function () { window.location.href = "provide-consent.html"; }, 900);
      }

      function start() {
        stop();
        timer = setInterval(tick, STEP_MS);
        // 눈 깜빡임 (face-closed) — 1~3 단계에서만
        blinkTimer = setInterval(function () {
          if (idx > 3) return;
          setFace("closed");
          setTimeout(function () { if (idx <= 3) setFace("open"); }, 140);
        }, 1600);
      }

      function stop() { clearInterval(timer); clearInterval(blinkTimer); }

      tick();
      start();

      $("exit").addEventListener("click", function () { stop(); cfOverlay("exitDialog", true); });
      $("keepGoing").addEventListener("click", function () { cfOverlay("exitDialog", false); if (!finished) start(); });
    })();
  </script>
</body>
</html>
