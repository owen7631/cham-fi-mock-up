<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>[M-10-03-15 · M-03-W-E1] 이력제 조회 실패 · CHAM-Fi</title>
  <link rel="stylesheet" href="css/chamfi.css" />
  <script src="js/auth.js"></script>
  <script src="js/farm.js"></script>
  <script src="js/chamfi.js"></script>
  <style>
    .edge-body { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 64px var(--space-5) var(--space-4); overflow: hidden; }
    .edge-face { flex: none; width: 120px; height: 120px; position: relative; }
    .edge-face .cf-face { width: 120px; height: 120px; background: var(--chamfi-notice-bg); }
    .edge-face .cf-face img { top: 0; }
    .edge-title { margin-top: var(--space-10); display: flex; flex-direction: column; align-items: center; gap: var(--space-2); text-align: center; width: 100%; }
    .edge-notice { margin-top: var(--space-6); width: 100%; }
    .edge-cta-2 { display: flex; flex-direction: column; gap: var(--space-3); }
    .cf-btn img { width: 16px; height: 16px; }
</style>
</head>
<body>
  <main class="phone">
    <header class="cf-header cf-header--exit">
      <a class="cf-exit" data-href="index.html">나가기</a>
    </header>
    <div class="edge-body">
      <div class="edge-face">
        <div class="cf-face">
          <img src="assets/face-open.png" alt="" />
          <img src="assets/face-trouble.png" alt="" class="is-on" />
          <img src="assets/face-smile.png" alt="" />
        </div>
      </div>
      <div class="edge-title">
        <h1 class="t-title-xl ink">축산물이력제 정보를<br />불러오지 못했어요</h1>
        <p class="t-body-sm ink-muted">잠시 후 다시 시도해 주세요</p>
      </div>
      <p class="cf-notice edge-notice">조회한 내용은 저장되지 않았어요</p>
      <div class="cf-spacer"></div>
    </div>

    <div class="cf-cta edge-cta-2">
      <a class="cf-btn cf-btn--secondary" data-href="index.html">나중에 하기</a>
      <a class="cf-btn cf-btn--primary" data-href="cattle-loading.html">다시 조회하기</a>
    </div>
  </main>

  <script>
    // 첫 화면을 그리기 전에 농장 값 · 탭 점 채움 (공통 스크립트는 <head> 에서 로드)
    cfFarm.bind(document);
    cfFarm.syncTabDot();
  </script>
</body>
</html>
